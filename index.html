<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14121c">
  <meta name="description" content="Track customers, credit, inventory and sales for your perfume business — works offline.">
  <title>Scentry — Perfume Seller Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Scentry</span>
    </div>
    <div class="topbar-actions">
      <button class="chip" id="install-btn" hidden>Install</button>
      <button class="icon-btn" id="data-btn" aria-label="Data and backup" title="Data &amp; backup">⋯</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Primary">
    <a class="nav-item" data-route="dashboard" href="#/dashboard">
      <span class="nav-ico">▦</span><span>Home</span>
    </a>
    <a class="nav-item" data-route="customers" href="#/customers">
      <span class="nav-ico">☺</span><span>Customers</span>
    </a>
    <a class="nav-item" data-route="sales" href="#/sales">
      <span class="nav-ico">🛍</span><span>Sales</span>
    </a>
    <a class="nav-item" data-route="inventory" href="#/inventory">
      <span class="nav-ico">▤</span><span>Stock</span>
    </a>
    <a class="nav-item" data-route="credit" href="#/credit">
      <span class="nav-ico">✦</span><span>Credit</span>
    </a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
